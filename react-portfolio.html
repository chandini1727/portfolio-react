<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chintala Chandini | React Portfolio</title>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #121212;
            --bg-secondary: #1E1E1E;
            --bg-card: rgba(30, 30, 30, 0.6);
            --text-primary: #F3F4F6;
            --text-secondary: #9CA3AF;
            --accent-emerald: #10B981;
            --accent-gold: #F59E0B;
            --border-color: rgba(255, 255, 255, 0.1);
            --font-heading: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background-color: var(--bg-main); 
            color: var(--text-primary); 
            font-family: var(--font-body); 
            min-height: 100vh;
        }

        /* App Container */
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header & Tabs */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 2rem;
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 800;
        }
        .logo span { color: var(--accent-emerald); }

        .tabs {
            display: flex;
            gap: 1rem;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-family: var(--font-body);
            font-size: 1rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease;
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-btn.active {
            color: var(--accent-emerald);
        }

        .tab-indicator {
            position: absolute;
            bottom: -5px;
            left: 0;
            height: 2px;
            width: 100%;
            background-color: var(--accent-emerald);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .tab-btn.active .tab-indicator {
            transform: scaleX(1);
        }

        /* Content Area */
        .content-area {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }

        /* Animations */
        .tab-pane {
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* Common Styles */
        h1, h2, h3 { font-family: var(--font-heading); }
        h1 { font-size: 3.5rem; line-height: 1.2; margin-bottom: 1rem; }
        h2 { font-size: 2rem; margin-bottom: 1.5rem; color: var(--text-primary); }
        p { color: var(--text-secondary); line-height: 1.6; margin-bottom: 1.5rem; }

        .btn {
            display: inline-block;
            padding: 0.8rem 1.8rem;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.3s;
        }
        .btn-primary { background-color: var(--accent-emerald); color: #000; }
        .btn-primary:hover { background-color: #059669; transform: translateY(-2px); }

        /* Experience Timeline */
        .timeline-item {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
            border-left: 4px solid var(--accent-emerald);
        }
        .timeline-item h3 { color: var(--text-primary); font-size: 1.25rem; }
        .timeline-item h4 { color: var(--accent-gold); font-weight: 500; font-size: 1rem; margin-bottom: 0.5rem; }
        .timeline-item .date { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem; }
        .timeline-item ul { list-style: none; padding-left: 1rem; }
        .timeline-item li { position: relative; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.95rem; }
        .timeline-item li::before { content: '▹'; position: absolute; left: -1rem; color: var(--accent-emerald); }

        /* Projects */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .project-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
        }
        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
        }
        .project-card h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .tech-stack { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: auto; }
        .tech-stack span { background: rgba(255,255,255,0.05); padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.8rem; color: var(--accent-emerald); }

        /* Skills */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem;
        }
        .skill-group h3 { border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; margin-bottom: 1rem; font-size: 1.1rem; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 0.8rem; }
        .skill-tags span { background: var(--bg-secondary); border: 1px solid rgba(255,255,255,0.1); padding: 0.5rem 1rem; border-radius: 4px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const HomeTab = () => (
            <div className="tab-pane">
                <p style={{color: 'var(--accent-emerald)', fontFamily: 'var(--font-heading)', fontWeight: 600, marginBottom: '1rem'}}>Hi, my name is</p>
                <h1>Chintala Chandini.</h1>
                <h2>I build scalable systems & reliable software.</h2>
                <p style={{maxWidth: '600px', fontSize: '1.1rem'}}>
                    Software Engineer with experience in backend development using Go, PostgreSQL, Docker, and Kubernetes.
                    Passionate about sandbox management, networking, and platform APIs. Strong foundation in data structures, 
                    databases, and distributed systems.
                </p>
                <a href="chandini resume.pdf" target="_blank" className="btn btn-primary" style={{marginTop: '1rem'}}>View Full Resume</a>
            </div>
        );

        const ExperienceTab = () => (
            <div className="tab-pane">
                <h2>Where I've Worked</h2>
                <div className="timeline-item">
                    <h3>Software Engineer I</h3>
                    <h4>NeevCloud</h4>
                    <p className="date">April 2026 - Present</p>
                    <ul>
                        <li>Designed and implemented full memory snapshot and restore workflows for sandboxes using gVisor runsc checkpoint.</li>
                        <li>Enhanced sandbox networking and resource management with template-based network egress policies.</li>
                        <li>Built centralized resource quota management and synchronization systems.</li>
                        <li>Designed BYOT (Bring Your Own Template) functionality with CRUD APIs and schema migrations.</li>
                    </ul>
                </div>
                <div className="timeline-item">
                    <h3>Intern</h3>
                    <h4>NeevCloud</h4>
                    <p className="date">Aug 2025 - March 2026</p>
                    <ul>
                        <li>Conducted end-to-end testing across platform services and improved E2E test suite.</li>
                        <li>Implemented audit logging across platform services to improve traceability.</li>
                        <li>Built the Audit Logs UI from Figma designs and integrated it with backend APIs.</li>
                    </ul>
                </div>
                <div className="timeline-item">
                    <h3>Product Intern</h3>
                    <h4>Souloxy (Mental Well-being Startup)</h4>
                    <p className="date">Feb 2025 - July 2025</p>
                    <ul>
                        <li>Designed and implemented a secure, role-based authentication system using Firebase, React, and Node.js.</li>
                        <li>Developed a responsive and interactive admin dashboard for managing wellness services.</li>
                        <li>Built real-time email notification system using SendGrid with over 90% delivery success rate.</li>
                    </ul>
                </div>
            </div>
        );

        const ProjectsTab = () => (
            <div className="tab-pane">
                <h2>Selected Projects</h2>
                <div className="projects-grid">
                    <div className="project-card">
                        <h3>Smart Learn and Career AI</h3>
                        <p style={{fontSize: '0.85rem', color: 'var(--accent-emerald)', marginBottom: '1rem'}}>March 2026</p>
                        <p>Developed a full-stack document intelligence platform to extract, analyze, and synthesize structured data from multi-format files. Implemented local semantic processing by generating vector embeddings.</p>
                        <div className="tech-stack">
                            <span>Next.js</span><span>PostgreSQL</span><span>Prisma</span><span>NLP Transformers</span>
                        </div>
                    </div>
                    <div className="project-card">
                        <h3>AI Chatbot</h3>
                        <p style={{fontSize: '0.85rem', color: 'var(--accent-emerald)', marginBottom: '1rem'}}>Feb 2025</p>
                        <p>Developed a full-stack AI-powered Q&A platform supporting uploads of multiple file types. Integrated a complete RAG pipeline with LangChain, OllamaEmbeddings, and LLaMA 3.</p>
                        <div className="tech-stack">
                            <span>React</span><span>Node.js</span><span>LangChain</span><span>LLaMA 3</span>
                        </div>
                    </div>
                </div>
            </div>
        );

        const SkillsTab = () => (
            <div className="tab-pane">
                <h2>Technical Skills</h2>
                <div className="skills-grid">
                    <div className="skill-group">
                        <h3>Languages</h3>
                        <div className="skill-tags">
                            <span>Go</span><span>Java</span><span>C</span><span>JavaScript</span><span>SQL</span>
                        </div>
                    </div>
                    <div className="skill-group">
                        <h3>Backend</h3>
                        <div className="skill-tags">
                            <span>Node.js</span><span>REST APIs</span><span>PostgreSQL</span><span>MySQL</span>
                        </div>
                    </div>
                    <div className="skill-group">
                        <h3>Frontend</h3>
                        <div className="skill-tags">
                            <span>React</span><span>Next.js</span><span>HTML</span><span>Tailwind CSS</span>
                        </div>
                    </div>
                    <div className="skill-group">
                        <h3>Infrastructure & Tools</h3>
                        <div className="skill-tags">
                            <span>Kubernetes</span><span>Docker</span><span>Linux</span><span>Firebase</span><span>Git</span>
                        </div>
                    </div>
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('home');

            const tabs = [
                { id: 'home', label: 'Home' },
                { id: 'experience', label: 'Experience' },
                { id: 'projects', label: 'Projects' },
                { id: 'skills', label: 'Skills' }
            ];

            const renderContent = () => {
                switch(activeTab) {
                    case 'home': return <HomeTab />;
                    case 'experience': return <ExperienceTab />;
                    case 'projects': return <ProjectsTab />;
                    case 'skills': return <SkillsTab />;
                    default: return <HomeTab />;
                }
            };

            return (
                <div className="app-container">
                    <header>
                        <div className="logo">C.<span>C</span></div>
                        <nav className="tabs">
                            {tabs.map(tab => (
                                <button 
                                    key={tab.id}
                                    className={`tab-btn ${activeTab === tab.id ? 'active' : ''}`}
                                    onClick={() => setActiveTab(tab.id)}
                                >
                                    {tab.label}
                                    <div className="tab-indicator"></div>
                                </button>
                            ))}
                        </nav>
                    </header>
                    <main className="content-area">
                        {renderContent()}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
